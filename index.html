<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Route Optimizer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body { font-family: Arial; }
.vehicle-card { cursor:pointer; transition:.3s }
.vehicle-card.selected { border:2px solid green; background:#ecfdf5 }
.route-option.active { border-left:4px solid green; background:#ecfdf5 }
</style>
</head>

<body class="bg-gray-50 p-6">

<h1 class="text-2xl font-bold mb-4">🚗 Smart Route Optimizer</h1>

<!-- VEHICLES -->
<div class="grid grid-cols-2 gap-3 mb-6" id="vehicles"></div>

<!-- INPUT -->
<div class="bg-white p-4 rounded shadow mb-4">
<input id="start" class="border p-2 w-full mb-2" placeholder="Start location">
<input id="end" class="border p-2 w-full mb-2" placeholder="Destination">
<input id="fuel" type="number" value="100" class="border p-2 w-full mb-2">

<button onclick="calculate()" class="bg-green-600 text-white px-4 py-2 rounded w-full">
Optimize Route
</button>
</div>

<!-- ROUTES -->
<div id="routes"></div>

<!-- RESULT -->
<div id="result" class="mt-4 text-lg font-semibold"></div>

<script>
const vehicles = {
 sedan:{name:"Sedan",consumption:7.5},
 suv:{name:"SUV",consumption:10},
 electric:{name:"EV",consumption:2}
};

let selectedVehicle = "sedan";

function renderVehicles(){
 const el=document.getElementById("vehicles");
 el.innerHTML="";
 for(let key in vehicles){
  el.innerHTML+=`
   <div onclick="selectVehicle('${key}')" 
    class="vehicle-card p-3 bg-white rounded shadow ${selectedVehicle===key?'selected':''}">
    ${vehicles[key].name}
   </div>`;
 }
}

function selectVehicle(v){
 selectedVehicle=v;
 renderVehicles();
}

function calculate(){
 let distance = Math.floor(Math.random()*50)+20;

 let fuelUsed = distance * vehicles[selectedVehicle].consumption / 100;
 let cost = fuelUsed * document.getElementById("fuel").value;

 let eco = cost * 0.8;
 let fast = cost * 1.2;
 let short = cost;

 document.getElementById("routes").innerHTML=`
  <div onclick="choose('eco',${eco})" class="route-option p-3 bg-white rounded mb-2">Eco Route - ₹${eco.toFixed(2)}</div>
  <div onclick="choose('fast',${fast})" class="route-option p-3 bg-white rounded mb-2">Fast Route - ₹${fast.toFixed(2)}</div>
  <div onclick="choose('short',${short})" class="route-option p-3 bg-white rounded mb-2">Shortest Route - ₹${short.toFixed(2)}</div>
 `;
}

function choose(type,cost){
 document.getElementById("result").innerText=
  "Selected "+type+" route. Cost: ₹"+cost.toFixed(2);
}

renderVehicles();
</script>

</body>
</html>
